<h2 class="mb-3">Import questions</h2>
<p class="text-muted">Fetch questions from Open Trivia DB and add them to a quiz.</p>

<div class="card mb-4">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Amount</label>
        <input type="number" class="form-control" value="10" min="1" max="50">
      </div>
      <div class="col-md-3">
        <label class="form-label">Category</label>
        <select class="form-select"><option>Science</option><option>History</option><option>Sports</option></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Difficulty</label>
        <select class="form-select"><option>Easy</option><option>Medium</option><option>Hard</option></select>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button class="btn btn-primary w-100">Fetch questions</button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h5 class="card-title">Preview</h5>
    <ul class="list-group mb-3">
      <li class="list-group-item">What is the chemical symbol for gold?</li>
      <li class="list-group-item">How many bones are in the adult human body?</li>
      <li class="list-group-item">Which gas do plants absorb from the air?</li>
    </ul>
    <button class="btn btn-success">Import selected</button>
  </div>
</div>
